[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wpop"
version = "0.1.0"
description = "Windows Performance Optimizer - scanner, scorer, and fix recommender"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wpop = "wpop.cli:main"

[tool.setuptools.packages.find]
include = ["wpop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]